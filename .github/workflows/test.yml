# Verify on every push. The verification scripts are the point: they check the
# installed package end to end, which is the failure mode a unit test cannot catch
# (a manifest that resolves to nothing, an export that names a missing file).
name: test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts: this package ships a prebuilt client, so nothing has to run at
      # install time, and skipping lifecycle scripts removes a supply-chain surface.
      - run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Build the client
        run: npm run build

      - name: Unit tests
        run: npm test

      # The suite must run on every supported Node version. --test-isolation=none is a
      # Node 24 flag; using it made every job fail before a single test ran, while passing
      # locally on 24.
      - name: The suite must not depend on a flag a supported Node lacks
        run: |
          if grep -q "test-isolation" package.json; then
            echo "package.json uses --test-isolation, which Node 20 and 22 reject"
            exit 1
          fi

      - name: The built bundle must be current
        run: |
          # If the committed bundle is stale, a fresh checkout behaves differently from
          # the machine it was built on.
          git diff --exit-code --stat lib/client.js

      - name: Verify the package ships what it promises
        run: node test/verify-coverage.mjs

      - name: Verify the goals hold
        run: node test/verify-goal.mjs

      - name: Verify the host contract
        run: node test/verify-host-contract.mjs

      - name: Verify the evidence path
        run: node test/verify-bundle-path.mjs

      - name: Verify distributed execution and identity
        run: node test/verify-distributed-identity.mjs

      # These report their specification checks and skip the live ones when the runtime is
      # absent. A hosted runner has no Docker daemon, no Slurm controller and no identity
      # provider, so the live halves skip - which is the honest outcome, not a pass.
      - name: Verify the container specification
        run: node test/verify-container-live.mjs
      - name: Verify the site renders under both deployment layouts
        run: node test/verify-site-layouts.mjs
      - name: Verify the tutorial commands still work
        run: node test/verify-tutorial.mjs

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm test
      # The scripts are the reason this matrix exists: path handling on Windows is where
      # this project has broken before.
      - run: node test/verify-goal.mjs
      - run: node test/verify-coverage.mjs
